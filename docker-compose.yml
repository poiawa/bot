version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: vpnbot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vpnbot
      POSTGRES_USER: vpnbot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vpnbot_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - vpnbot_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpnbot -d vpnbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: vpnbot_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret_password}
    volumes:
      - redis_data:/data
    networks:
      - vpnbot_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    container_name: vpnbot_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://vpnbot:${DB_PASSWORD:-vpnbot_secret_password}@postgres:5432/vpnbot
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret_password}@redis:6379
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      APP_SECRET: ${APP_SECRET}
    volumes:
      - ./backend/src:/app/src:ro
      - uploads:/app/uploads
      - backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vpnbot_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Admin Dashboard & Customer Portal)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: vpnbot_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://backend:3000
      VITE_MINI_APP_URL: ${MINI_APP_URL:-http://localhost:3000}
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - vpnbot_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: vpnbot_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - backend
      - frontend
    networks:
      - vpnbot_network

  # Celery Worker (Background Jobs)
  worker:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    container_name: vpnbot_worker
    restart: unless-stopped
    command: npm run worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://vpnbot:${DB_PASSWORD:-vpnbot_secret_password}@postgres:5432/vpnbot
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret_password}@redis:6379
    volumes:
      - ./backend/src:/app/src:ro
      - uploads:/app/uploads
    depends_on:
      - postgres
      - redis
    networks:
      - vpnbot_network

networks:
  vpnbot_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads:
  backups:
